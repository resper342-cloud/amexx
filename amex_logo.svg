<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="amexBoxGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006FCF" />
      <stop offset="100%" stop-color="#002663" />
    </linearGradient>
  </defs>

  <!-- Amex Blue Box Emblem -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="6" fill="url(#amexBoxGradLight)" stroke="#006FCF" stroke-width="1.5" />
    <rect x="5" y="5" width="42" height="42" rx="3" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" />
    <text x="26" y="25" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">AMERICAN</text>
    <text x="26" y="37" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">EXPRESS</text>
  </g>

  <!-- Typography: American Express Personal Loans -->
  <g transform="translate(70, 31)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="17" fill="#002663" letter-spacing="-0.2">
      AMERICAN EXPRESS
    </text>
    <text y="19" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="13" fill="#006FCF" letter-spacing="0.5">
      Personal Loans
    </text>
  </g>
</svg>
